<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07111f" />
    <title>TradeVault AI</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #f8fafc;
        background:
          radial-gradient(circle at 20% 10%, rgba(16, 185, 129, .22), transparent 38%),
          radial-gradient(circle at 85% 85%, rgba(5, 150, 105, .16), transparent 40%),
          #07111f;
      }
      main { width: min(100%, 420px); text-align: center; }
      img { width: 128px; height: 128px; object-fit: contain; margin: 0 auto 24px; }
      h1 { margin: 0 0 12px; font-size: 28px; letter-spacing: -.04em; }
      p { margin: 0 0 28px; color: #94a3b8; line-height: 1.6; }
      button {
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 15px 20px;
        color: #04180b;
        background: linear-gradient(135deg, #86efac, #22c55e);
        font: inherit;
        font-weight: 800;
      }
      small { display: block; margin-top: 20px; color: #64748b; }
    </style>
  </head>
  <body>
    <main>
      <img src="brand-mark.svg" alt="TradeVault" />
      <h1>TradeVault AI</h1>
      <p>You appear to be offline. Reconnect to load live prices and your secure AI workspace.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <small>Your account and trades stay on the secure TradeVault server.</small>
    </main>
  </body>
</html>
