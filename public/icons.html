<!DOCTYPE html>
<html>
<body>
  <canvas id="c512" width="512" height="512"></canvas>
  <canvas id="c192" width="192" height="192"></canvas>
  <br>
  <a id="link512" href="#">Download icon-512.png</a>
  <br>
  <a id="link192" href="#">Download icon-192.png</a>
  <script>
    const img = new Image();
    img.onload = function() {
      const c512 = document.getElementById('c512');
      c512.getContext('2d').drawImage(img, 0, 0, 512, 512);
      document.getElementById('link512').href = c512.toDataURL('image/png');

      const c192 = document.getElementById('c192');
      c192.getContext('2d').drawImage(img, 0, 0, 192, 192);
      document.getElementById('link192').href = c192.toDataURL('image/png');
    };
    img.src = '/icon.svg';
  </script>
</body>
</html>
