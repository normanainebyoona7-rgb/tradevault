<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Candlestick bullish -->
  <rect x="180" y="180" width="16" height="120" rx="3" fill="#10b981"/>
  <line x1="188" y1="140" x2="188" y2="180" stroke="#10b981" stroke-width="5"/>
  <line x1="188" y1="300" x2="188" y2="340" stroke="#10b981" stroke-width="5"/>
  
  <!-- Candlestick bearish -->
  <rect x="220" y="150" width="16" height="100" rx="3" fill="#ef4444"/>
  <line x1="228" y1="120" x2="228" y2="150" stroke="#ef4444" stroke-width="5"/>
  <line x1="228" y1="250" x2="228" y2="280" stroke="#ef4444" stroke-width="5"/>
  
  <!-- Upward arrow (trend) -->
  <path d="M260 320 L290 260 L320 260 L290 200 L260 260 L270 260 Z" fill="url(#gold)" opacity="0.8"/>
  
  <!-- TV text -->
  <text x="180" y="410" fill="url(#gold)" font-size="80" font-weight="900" font-family="Arial, sans-serif" letter-spacing="5">TRADE</text>
  <text x="155" y="480" fill="white" font-size="55" font-weight="700" font-family="Arial, sans-serif" letter-spacing="12">VAULT</text>
</svg>